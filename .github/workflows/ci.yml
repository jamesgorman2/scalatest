name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Steps after a failing test step still run (`!cancelled()`), so one run reports every failing suite.

jobs:
  mima:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: 'sbt'
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - name: Check binary compatibility with ScalaTest 3.2.20
      run: >-
        sbt "all
        scalatestCompatible/mimaReportBinaryIssues
        scalacticDotty/mimaReportBinaryIssues scalatestDotty/mimaReportBinaryIssues
        scalacticDottyJS/mimaReportBinaryIssues scalatestDottyJS/mimaReportBinaryIssues
        scalacticDottyNative/mimaReportBinaryIssues scalatestDottyNative/mimaReportBinaryIssues"

  test-jvm:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: 'sbt'
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - name: Test Scalactic
      run: sbt scalacticTestDotty/test
    - name: Test ScalaTest
      if: ${{ !cancelled() }}
      run: sbt scalatestTestDotty/test
    - name: Test the consolidation library
      if: ${{ !cancelled() }}
      run: sbt scalatestConsolidation/test
    - name: Check the consolidation library has no Mill dependency
      if: ${{ !cancelled() }}
      run: sbt scalatestConsolidation/checkNoMillDependency
    - name: Check the Mill plugin's version is the release version
      if: ${{ !cancelled() }}
      run: sbt scalatestConsolidation/checkMillPluginVersion

  test-scala-js:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: 'sbt'
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Test Scalactic
      run: sbt scalacticTestDottyJS/test
    - name: Test ScalaTest
      if: ${{ !cancelled() }}
      run: sbt scalatestTestDottyJS/test

  test-scala-native:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: 'sbt'
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - name: Test Scalactic
      run: sbt scalacticTestDottyNative/test
    - name: Test ScalaTest
      if: ${{ !cancelled() }}
      run: sbt scalatestTestDottyNative/test

  test-mill-plugin:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: 'sbt'
    - name: Setup sbt
      uses: sbt/setup-sbt@v1
    - name: Publish the fork locally for the plugin's build
      run: sbt scalatestCompatible/publishLocal scalacticDotty/publishLocal scalatestDotty/publishLocal
    - name: Test the Mill plugin
      working-directory: mill-plugin
      run: ./mill --no-daemon plugin.test.testForked + plugin.integration.testForked
